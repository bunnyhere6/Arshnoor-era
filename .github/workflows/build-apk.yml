name: Build Arshnoor Era APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Rearrange Structure for Build
        run: |
          mkdir -p app/src/main/java/com/arshnoor/era app/src/main/assets
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.java app/src/main/java/com/arshnoor/era/
          mv injector.js app/src/main/assets/
          mv build.gradle app/
          echo "include ':app'" > settings.gradle

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Arshnoor Era APK
        uses: actions/upload-artifact@v4
        with:
          name: Arshnoor-Era-V10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
