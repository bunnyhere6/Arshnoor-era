plugins {
    id 'com.android.application'
}
android {
    namespace 'com.arshnoor.era'
    compileSdk 34
    defaultConfig {
        applicationId "com.arshnoor.era"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "10.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
